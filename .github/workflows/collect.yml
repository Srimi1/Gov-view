name: Collect opportunities

# Runs every hour; each source has its own cadence in sources/registry.json,
# so most runs only touch a few sources. Free on public repositories.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Only these source ids (comma separated). Empty = all due sources."
        required: false
      force:
        description: "Ignore cadence"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: npm
      # Collection needs no install scripts from dependencies.
      - run: npm ci --ignore-scripts

      - name: Collect
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          SOURCE: ${{ inputs.source }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$SOURCE" ]; then args+=(--source "$SOURCE"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          npm run collect -- "${args[@]}"

      - name: Test collected data
        run: npm test

      # Every change goes through a pull request: reviewing and merging it is publishing.
      - name: Open or update the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No data changes."
            exit 0
          fi
          branch="data/collected"
          git config user.name "gov-view-collector"
          git config user.email "gov-view-collector@users.noreply.github.com"
          git checkout -B "$branch"
          git add data
          git commit -m "data: collected $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin "$branch"
          summary=$(node -e 'const s=require("./data/published/sources-status.json");for(const [id,v] of Object.entries(s))console.log(`- **${id}**: ${v.lastError?`failed: ${v.lastError}`:`${v.recordCount} records`}`)')
          body=$(printf "Automated collection from official sources.\n\n%s\n\nReview the diff (one record per line), then merge to publish. Reviewer corrections go in data/overrides/<id>.json." "$summary")
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --head "$branch" --base main --title "Collected opportunities" --body "$body"
          fi
